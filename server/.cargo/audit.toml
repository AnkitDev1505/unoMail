# cargo-audit configuration.
[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa: "Marvin" timing side channel in private-key operations).
    # The rsa crate generates DKIM key pairs (security/dkim.rs; DKIM signatures themselves are
    # produced by aws-lc-rs, through mail-auth) and performs the S/MIME private-key operations (smime.rs): signing a
    # message its owner sends, and decrypting a message its owner reads. The attack needs an
    # oracle: many chosen ciphertexts decrypted on demand, with precise timing of each. Here a
    # decryption happens only when the key's owner opens a message in their own session, with
    # their own key, and its timing is visible to that session only; a sender of crafted
    # messages can neither trigger it nor observe it. OpenPGP encryption at rest uses public
    # keys only. Re-evaluate if that changes or when a fixed release is published.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0387 (crypto-bigint < 0.7.6: operations meant to be constant-time are not).
    # crypto-bigint 0.5 comes in only through pgp 0.21 (elliptic-curve 0.13, cx448); no pgp release
    # on the fixed version exists yet. The server holds no OpenPGP private keys: openpgp.rs parses
    # public keys and encrypts incoming mail to them. The only secret in that path is the one-time
    # ECDH key of each encryption, and leaking it would reveal only that one message, to a sender
    # who wrote it. Decryption and signing happen in the browser (openpgp.js). Remove once pgp
    # moves to crypto-bigint 0.7.
    "RUSTSEC-2026-0387",
]
